# Hive International — Netlify configuration
# Static HTML/CSS/JS. No build step.
# Netlify automatically serves /404.html for unmatched routes — no redirect needed.

[build]
  publish = "."

# Pretty URLs (serve /capabilities for /capabilities.html, etc.)
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = true

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS revalidate on every load (cheap 304s) so content updates propagate
# immediately — the site is hand-maintained and iterated.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The footprint map data is edited as the footprint grows — revalidate it too.
[[headers]]
  for = "/assets/map/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
